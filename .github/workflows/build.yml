name: Build APK

on:
  push:
    branches: [master, main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure build-tools 35 (d8 fix for enums)
        run: |
          yes | sdkmanager "build-tools;35.0.0" > /dev/null || true

      - name: Cache signing keystore
        uses: actions/cache@v4
        with:
          path: ~/.jumpjump
          key: jumpjump-signing-keystore-v1

      - name: Build signed APK
        run: |
          chmod +x scripts/build_apk.sh
          JUMP_KEYSTORE=~/.jumpjump/signing.keystore scripts/build_apk.sh

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: JumpJump-APK
          path: JumpJump.apk

      - name: Create release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF#refs/tags/}" JumpJump.apk \
            --title "Jump Jump ${GITHUB_REF#refs/tags/v}" \
            --generate-notes || true
