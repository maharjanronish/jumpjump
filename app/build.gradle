plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.maharjanronish.jumpjump'
    compileSdk 34

    defaultConfig {
        applicationId "io.github.maharjanronish.jumpjump"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false   // no dependencies: the APK is ~64 KB anyway
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

// No dependencies at all - that is the point. :)
dependencies { }
